# KIND cluster config. 
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  # The MongoDB worker. Its mongo-data label is used to place the database pod.
  - role: worker
    labels:
      mongo-data: "true"
    extraMounts:
      - hostPath: /workspaces/callum-codespace/multi-component-app/data
        containerPath: /mnt/mongo-data
  # A second worker for other workloads (e.g. the Express Web App).
  - role: worker
