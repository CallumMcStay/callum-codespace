apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  # Keep the data when the PVC is deleted.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  # A local volume exists on one node only.
  local:
    path: /mnt/mongo-data
  # The node that has this volume.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: mongo-data
              operator: In
              values: ["true"]
