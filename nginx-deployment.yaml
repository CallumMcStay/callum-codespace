apiVersion: apps/v1
kind:  Deployment
metadata:
  name: nginx-depl
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 2
  strategy:
  type: RollingUpdate
  rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-pod
  template:
    metadata:
      name: nginx-pod-spec
      labels:
        app: nginx-pod
    spec:
      containers:
      - name: nginx
        image: nginx:1.24.0
        ports:
        - containerPort: 80
